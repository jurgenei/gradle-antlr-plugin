name: SpotBugs Security

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  spotbugs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run SpotBugs if configured
        shell: bash
        run: |
          if ./gradlew -q tasks --all | grep -q "spotbugsMain"; then
            ./gradlew --no-daemon spotbugsMain
          elif ./gradlew -q tasks --all | grep -q "spotbugs$"; then
            ./gradlew --no-daemon spotbugs
          else
            echo "No SpotBugs task configured; skipping."
          fi

