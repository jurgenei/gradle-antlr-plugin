
plugins {
    id 'java'
    id 'org.flowdigger.gradle.antlr'
}

repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
}

dependencies {
    implementation 'org.antlr:antlr4-runtime:4.13.2'
    implementation 'org.flowdigger.gradle:gradle-antlr-plsql-plugin:0.1.3'
}

tasks.named('xmlast', org.flowdigger.gradle.antlr.XmlAstGradleTask) {
    sourceDirectory.set(layout.projectDirectory.dir('../../src/test/resources/fixtures/mini/valid'))
    destinationDirectory.set(layout.buildDirectory.dir('xml-ast-samples'))

    parserClassName.set('org.flowdigger.parsers.PlSqlParser')
    lexerClassName.set('org.flowdigger.parsers.PlSqlLexer')
    startRule.set('script')

    includes.set(['**/*.sql'])
    targetExtension.set('.xml')
    continueOnError.set(true)
}

tasks.register('xirast', org.flowdigger.gradle.antlr.XmlAstGradleTask) {
    sourceDirectory.set(layout.projectDirectory.dir('../../src/test/resources/fixtures/mini/valid'))
    destinationDirectory.set(layout.buildDirectory.dir('xir-ast-samples'))

    parserClassName.set('org.flowdigger.parsers.PlSqlParser')
    lexerClassName.set('org.flowdigger.parsers.PlSqlLexer')
    startRule.set('script')


    includes.set(['**/*.sql'])
    targetExtension.set('.xir')
    outputFormat.set('beautified')
    continueOnError.set(true)
}